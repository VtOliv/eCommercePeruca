<app-header></app-header>

<div id="form1" class="d-flex justify-content-center centro py-4">
  <div class="container-fluid row">
    
    <div class="col-md-6">
      <form id="formulario" [formGroup]="formFaleConosco" (ngSubmit)="onSubmit()" class="bg-light p-3 rounded shadow-sm">
        
        <div id="texto">
          <div class="p-2">

            <div class="form-group mb-4">
              <div class="enviemsg d-flex align-items-center">
                <h4 class="mb-0 mr-2"><strong>Envie uma Mensagem</strong></h4>
                <img src="assets/images/enviar (1).png" alt="ícone enviar" class="enviar" width="30">
              </div>
            </div>

            <div class="form-group">
              <label for="nome">Nome Completo:</label>
              <input id="nome" class="form-control" type="text" 
                     formControlName="nomeCompleto" placeholder="Nome completo"
                     (keypress)="permitirLetrasCont($event)">
            </div>

            <div class="form-group">
              <label for="tel">Seu Telefone:</label>
              <input id="tel" class="form-control" type="text" 
                     formControlName="telefone" placeholder="(00) 00000-0000" 
                     mask="(00) 00000-0000" (keypress)="permitirNumerosCont($event)">
            </div>

            <div class="form-group">
              <label for="email">Endereço de e-mail:</label>
              <input id="email" class="form-control" type="email" 
                     formControlName="email" placeholder="Email">
            </div>

            <div class="form-group">
              <label for="msg">Escreva sua Mensagem:</label>
              <textarea id="msg" class="form-control" formControlName="mensagem" 
                        rows="4" placeholder="Escreva aqui sua mensagem"></textarea>
            </div>

            <div class="form-group">
              <label for="assunto">Assunto da mensagem:</label>
              <select id="assunto" formControlName="statusFL" class="custom-select">
                <option [ngValue]="null" selected disabled hidden>Selecione o Assunto</option>
                @for (s of status; track s) {
                  <option [ngValue]="s">{{ s.descricaoStatus }}</option>
                }
              </select>
            </div>

            <div class="custom-control custom-checkbox mb-4">
              <input type="checkbox" class="custom-control-input" id="newsletterCheck">
              <label class="custom-control-label" for="newsletterCheck">
                Receber promoções via e-mail?
              </label>
            </div>

            <div id="btn">
              <button class="btn btn-lg btn-dark btn-block shadow-sm" type="submit" 
                      [disabled]="formFaleConosco.invalid">
                Enviar mensagem
              </button>
            </div>

          </div>
        </div>
      </form>
    </div>

    <div class="col-md-6">
      <div class="p-2 mb-4">
        <div class="enviemsg d-flex align-items-center text-dark">
          <h4 class="mb-0 mr-2"><strong>Informações de Contato</strong></h4>
          <img src="assets/images/reclamar.png" alt="ícone contato" class="reclamar" width="30">
        </div>
      </div>

      <div id="redes" class="jumbotron bg-dark text-light p-4 shadow">
        <div class="contact-info">
          <p><i class="pi pi-envelope mr-2"></i> E-mail: <strong>Wigs-house@gmail.com</strong></p>
          <p><i class="pi pi-phone mr-2"></i> Televendas: (11) 3746-6913</p>
          <p><i class="pi pi-headphones mr-2"></i> SAC: (11) 0800 777 700</p>
          <hr class="bg-secondary">
          <p><strong>Endereço Central:</strong></p>
          <p class="small">R. Minas Gerais, 316 - Higienópolis, São Paulo - SP, 01244-010</p>
          
          <div class="embed-responsive embed-responsive-16by9 mt-3 rounded overflow-hidden">
            <iframe class="embed-responsive-item" 
                    [src]="mapaUrl" 
                    allowfullscreen="" 
                    loading="lazy"></iframe>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<app-footer></app-footer>
