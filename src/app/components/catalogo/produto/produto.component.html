<div class="container d-flex justify-content-end mb-3">
  <label class="mr-2">Ordenar por:</label>
  <select class="form-control-sm" (change)="ordenarPor()" [(ngModel)]="ordenacao">
    <option value="1" disabled>Padrão</option>
    <option value="2">Menor preço</option>
    <option value="3">Maior preço</option>
    <option value="4">A - Z</option>
    <option value="5">Z - A</option>
  </select>
</div>

<div id="produtos" class="container d-flex justify-content-center flex-wrap">
  
  @for (produto of produtosFiltrados; track produto.codProduto) {
    <div class="d-flex col-md-3 col-xs-12 mb-4">
      <div class="card h-100">
        <div class="text-center p-2">
          <img [src]="produto.imagens?.[0]?.local ?? 'assets/images/placeholder.png'" 
               class="imagem-produto" 
               alt="Imagem do produto"
               style="max-width: 100%; height: 200px; object-fit: contain;">
        </div>
        
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ produto.descricao }}</h5>
          
          <p class="card-text">
            <small class="text-muted">{{ produto.categoria?.descricao }}</small> <br>
            <strong>
              {{ produto.valorProduto | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
            </strong>
          </p>

          <div class="mt-auto">
            <button 
              (click)="produto.codProduto && abrirPaginaProduto(produto.codProduto)" 
              class="btn btn-dark btn-block text-white"
              [disabled]="!produto.codProduto">
              Comprar
            </button>
          </div>
        </div>
      </div>
    </div>
  } @empty {
    <div class="mt-4 col-12">
      <div class="alert alert-info text-center" role="alert">
        <span class="sem-produtos">
          Sua pesquisa não retornou nenhum produto...
        </span>
      </div>
    </div>
  }

</div>
